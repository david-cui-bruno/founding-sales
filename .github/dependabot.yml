# Dependency-update automation. See docs/greenfield/release.md, section 9.
#
# One npm entry at the root: this is an npm-workspaces repository (`apps/*`,
# `packages/*`), so the root manifest and lockfile are the whole dependency set and
# Dependabot resolves every workspace from them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: deps
    groups:
      # Everything that is not a major, in one pull request the gate can judge as a
      # whole.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
