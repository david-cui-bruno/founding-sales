name: Source security gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    # Every push and pull request, whatever it touches: the Gitleaks scan of the full
    # history and of the tracked tree (scripts/verifySecrets.mjs). Linux, so it never
    # waits for a macOS runner: Gitleaks 8.30.1 from the linux_x64 tarball, pinned by
    # the SHA-256 in the v8.30.1 release's checksums file
    # (docs/decisions/g89-greenfield-is-the-default.md).
    # GitHub-hosted disposable runner only. No protected release environment.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert supported Node and architecture
        # The tarball below is the linux_x64 build, so the runner must be one.
        run: |
          node -e "if (process.versions.node !== '24.20.0' || process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Install integrity-pinned Gitleaks 8.30.1
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/callie-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$tool_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          test "$("$tool_dir/gitleaks" version)" = '8.30.1'
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan the history and the tracked tree
        # scripts/verifySecrets.mjs imports only Node's own modules, so nothing is installed.
        run: |
          set -euo pipefail
          npm run verify:secrets

  root-scripts:
    # The scripts at the repository root, which neither workspace lint reaches:
    # `npm run lint:root-scripts` (eslint.config.mjs over an explicit file list), on
    # every change. apps/, packages/ and test/release/ are `npm run lint:greenfield`,
    # in .github/workflows/greenfield.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert the supported Node version
        run: |
          node -e "if (process.versions.node !== '24.20.0') process.exit(1)"
      - name: Install the root packages without install scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the greenfield root scripts
        run: |
          set -euo pipefail
          npm run lint:root-scripts
