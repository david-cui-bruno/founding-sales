name: Source security gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    # Every push and pull request, whatever it touches: the Gitleaks scan of the full
    # history and of the tracked tree (scripts/verifySecrets.mjs). Until lane g89 this
    # ran inside `source`; it is its own job so that it keeps running when `source` is
    # skipped. Linux, so it never waits for a macOS runner: the same Gitleaks 8.30.1
    # and the same scan, from the linux_x64 tarball, pinned by the SHA-256 in the
    # v8.30.1 release's checksums file (docs/decisions/g89-greenfield-is-the-default.md).
    # GitHub-hosted disposable runner only. No protected release environment.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert supported Node and architecture
        # The tarball below is the linux_x64 build, so the runner must be one.
        run: |
          node -e "if (process.versions.node !== '24.20.0' || process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Install integrity-pinned Gitleaks 8.30.1
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/callie-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$tool_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          test "$("$tool_dir/gitleaks" version)" = '8.30.1'
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Install the root packages without install scripts
        # The scanner needs only @electron/asar from node_modules; nothing is built.
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Scan the history and the tracked tree
        run: |
          set -euo pipefail
          npm run verify:secrets

  root-scripts:
    # The greenfield files at the repository root that the old trees' lint used to
    # cover on every pull request (`npm run legacy:lint:tracked` reads every tracked
    # script outside apps/, packages/ and test/release/). The same ESLint config, the
    # same files, on every change, so `source` can be skipped without losing it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert the supported Node version
        run: |
          node -e "if (process.versions.node !== '24.20.0') process.exit(1)"
      - name: Install the root packages without install scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint the greenfield root scripts
        run: |
          set -euo pipefail
          npm run lint:root-scripts

  old-trees-changed:
    # Decides whether `source` and `client` run. They test the previous-generation
    # app (src/, client/, cloud/, native/, tests/, test/*, most of scripts/ and the
    # root configs), take the longest of any job and wait for a macOS runner, and the
    # greenfield tree never reaches them. A change confined to the greenfield-only
    # paths below skips both; any other path runs both, including a path added later
    # that this list does not know about. A skipped job reports success to a
    # required status check; a failure of this job fails the pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the change with the greenfield-only paths
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Only the greenfield tree reads these. Everything else is read by the old
          # gates: root package.json and the lock file, .gitleaks.toml, docs/engineering
          # and docs/archive, the other scripts, and this workflow itself.
          greenfield_only='^(apps/|packages/|infra/|certs/|test/release/|docs/greenfield/|docs/decisions/|\.github/workflows/greenfield[a-z-]*\.yml$|Dockerfile\.(api|worker)(\.dockerignore)?$|tsconfig\.base\.json$|eslint\.greenfield\.mjs$|scripts/(productionSmoke|releaseMutationCheck|releaseMutationRunner)\.mjs$|scripts/mutations/[^/]+\.mjs$|README\.md$)'
          base=''
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            # The checkout is the pull request's merge commit. Its first parent is the
            # base branch it was merged onto, so the difference is exactly this change.
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
              base="$(git rev-parse HEAD^1)"
            fi
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ]; then
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # No base to compare with is not evidence that the change stayed in the
            # greenfield tree.
            echo 'No base commit to compare with, so the old-tree gates run.'
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only --no-renames "$base" HEAD)"
          set +e
          outside="$(printf '%s\n' "$changed" | grep -Ev -e "$greenfield_only" -e '^$')"
          status=$?
          set -e
          case "$status" in
            0)
              echo "$(printf '%s\n' "$outside" | wc -l | tr -d ' ') changed path(s) outside the greenfield tree, so the old-tree gates run. The first 50:"
              printf '%s\n' "$outside" | sed -n '1,50p'
              echo 'run=true' >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo 'Every changed path is greenfield-only, so the old-tree gates are skipped.'
              echo 'run=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo '::error::The changed-path comparison failed.'
              exit 1
              ;;
          esac

  source:
    # The previous-generation app's gate. Runs only when old-trees-changed says so.
    # GitHub-hosted disposable runner only. No protected release environment.
    needs: old-trees-changed
    if: needs.old-trees-changed.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert supported Node and architecture
        run: |
          node -e "if (process.versions.node !== '24.20.0' || process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Install integrity-pinned Gitleaks 8.30.1
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/callie-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz -o "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 "$tool_dir/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          test "$("$tool_dir/gitleaks" version)" = '8.30.1'
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Install root and independent pinned Lambda packages
        run: |
          set -euo pipefail
          npm ci
          # The root postinstall no longer builds the old app's native modules
          # (lane g89); this is the step it used to run after fetching Electron.
          npm run legacy:setup
          while IFS= read -r -d '' lock; do
            npm ci --prefix "${lock%/package-lock.json}"
          done < <(git ls-files -z -- 'cloud/lambdas/*/package-lock.json')
          npx playwright install chromium
      - name: Source, independent Lambda and operational graph gates
        run: |
          # Fail early on scanner/history problems, and retain the final scan of generated output below.
          npm run verify:secrets
          npm run legacy:typecheck
          npm run legacy:lint:tracked
          npm run legacy:test
          npm run legacy:test:browser:native-desk
          npm run legacy:test:helpers:node
          npm run legacy:verify:lambdas
          npm run legacy:build:operational-tools
          npm run verify:secrets
  client:
    # The thin client package only: its own tsc, lint, Vitest and Playwright runs against the stub worker.
    # Runs only when old-trees-changed says so.
    needs: old-trees-changed
    if: needs.old-trees-changed.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert supported Node and architecture
        run: |
          node -e "if (process.versions.node !== '24.20.0' || process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Install the root packages without native builds (the client's Forge configuration imports the root build helpers)
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
      - name: Install the client package
        run: |
          set -euo pipefail
          npm ci --prefix client
      - name: Client gate
        run: |
          set -euo pipefail
          cd client
          npm run typecheck
          npm run lint
          npm test
          npm run test:browser
