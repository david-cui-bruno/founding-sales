name: CRM acquisition diagnostic lifecycle

# Independent opt-in path. No production deployment, sending or acquisition authority.
# Reviewed documents and real isolated Google inputs require protected-secret setup;
# this source does not provision those secrets or attest their live permissions.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Explicit operation; disabled makes no cloud call."
        type: choice
        required: true
        default: disabled
        options: [disabled, proposal, lifecycle]
      reviewed_sha256:
        description: "Exact reviewed storage-approval SHA (proposal) or lease SHA (lifecycle)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: greenfield-rehearsal
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage != 'disabled'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: rehearsal
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Freeze reviewed private inputs before cloud access
        id: inputs
        env:
          DIAGNOSTIC_STAGE: ${{ inputs.stage }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
          STORAGE_APPROVAL_JSON: ${{ secrets.FSS_DIAGNOSTIC_STORAGE_APPROVAL_JSON }}
          CONFIGURATION_JSON: ${{ secrets.FSS_DIAGNOSTIC_CONFIGURATION_JSON }}
          LEASE_JSON: ${{ secrets.FSS_DIAGNOSTIC_LEASE_JSON }}
          PRIVATE_GOOGLE_JSON: ${{ secrets.FSS_DIAGNOSTIC_GOOGLE_INPUT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          try:
              stage = os.environ['DIAGNOSTIC_STAGE']
              digest = os.environ['REVIEWED_SHA256']
              if stage not in ['proposal', 'lifecycle'] or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise ValueError()
              root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'diagnostic-inputs'
              root.mkdir(mode=0o700)
              def save(name, value):
                  if not value or len(value.encode()) > 32768:
                      raise ValueError()
                  json.loads(value)
                  with open(root / name, 'x') as output:
                      os.chmod(root / name, 0o600)
                      output.write(value)
              document = os.environ['STORAGE_APPROVAL_JSON'] if stage == 'proposal' else os.environ['LEASE_JSON']
              if hashlib.sha256(document.encode()).hexdigest() != digest:
                  raise ValueError()
              parsed = json.loads(document)
              if parsed['sourceCommit'] != os.environ['GITHUB_SHA'] or os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise ValueError()
              save('approval.json' if stage == 'proposal' else 'lease.json', document)
              if stage == 'proposal':
                  save('configuration.json', os.environ['CONFIGURATION_JSON'])
                  prefix = parsed['prefix']
                  if not re.fullmatch(r'fss-rh-[a-z0-9][a-z0-9-]{1,16}[a-z0-9]', prefix):
                      raise ValueError()
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write(f'FSS_DIAGNOSTIC_RUN_SUFFIX={prefix[7:]}\n')
                      for service in ['api', 'worker']:
                          image = parsed['images'][service]
                          if not re.fullmatch(r'sha256:[0-9a-f]{64}', image):
                              raise ValueError()
                          output.write(f'FSS_DIAGNOSTIC_{service.upper()}_DIGEST={image}\n')
              else:
                  save('google.private.json', os.environ['PRIVATE_GOOGLE_JSON'])
          except Exception:
              print('diagnostic private inputs refused', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Verify lifecycle prerequisites without a cloud call
        id: validate
        if: inputs.stage == 'lifecycle'
        env:
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: |
          set -euo pipefail
          node infra/scripts/diagnostic-lifecycle.mjs validate \
            "$RUNNER_TEMP/diagnostic-inputs/lease.json" "$REVIEWED_SHA256" "$RUNNER_TEMP/diagnostic-lifecycle" \
            < "$RUNNER_TEMP/diagnostic-inputs/google.private.json"
      - name: Assume only the protected normal rehearsal role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.FSS_REHEARSAL_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: diagnostic-primary-${{ github.run_id }}
      - name: Retain a fresh private exact proposal without creation
        if: inputs.stage == 'proposal'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
          FSS_DIAGNOSTIC_ZONES: "us-east-1a,us-east-1d"
          FSS_DIAGNOSTIC_CERTIFICATE_ARN: ${{ secrets.FSS_REHEARSAL_CERTIFICATE_ARN }}
          FSS_DIAGNOSTIC_API_REPOSITORY: ${{ secrets.FSS_REHEARSAL_API_REPOSITORY }}
          FSS_DIAGNOSTIC_WORKER_REPOSITORY: ${{ secrets.FSS_REHEARSAL_WORKER_REPOSITORY }}
        run: |
          set -euo pipefail
          umask 077
          node --experimental-transform-types --disable-warning=ExperimentalWarning infra/scripts/diagnostic-handoff.mjs prepare \
            "$RUNNER_TEMP/diagnostic-inputs/approval.json" "$REVIEWED_SHA256" \
            "$RUNNER_TEMP/diagnostic-inputs/configuration.json" "$RUNNER_TEMP/diagnostic-proposal" infra/roots/rehearsal
      - name: Apply only the exact approved saved plan
        if: inputs.stage == 'lifecycle'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          node infra/scripts/diagnostic-lifecycle.mjs apply \
            "$RUNNER_TEMP/diagnostic-inputs/lease.json" "$REVIEWED_SHA256" "$RUNNER_TEMP/diagnostic-lifecycle" \
            < "$RUNNER_TEMP/diagnostic-inputs/google.private.json"
      - name: Refresh the normal role after application
        if: inputs.stage == 'lifecycle'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.FSS_REHEARSAL_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: diagnostic-prepare-${{ github.run_id }}
      - name: Prepare and hold only the approved interactive lifetime
        if: inputs.stage == 'lifecycle'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          node infra/scripts/diagnostic-lifecycle.mjs prepare \
            "$RUNNER_TEMP/diagnostic-inputs/lease.json" "$REVIEWED_SHA256" "$RUNNER_TEMP/diagnostic-lifecycle" \
            < "$RUNNER_TEMP/diagnostic-inputs/google.private.json"
          node infra/scripts/diagnostic-lifecycle.mjs hold \
            "$RUNNER_TEMP/diagnostic-inputs/lease.json" "$REVIEWED_SHA256" "$RUNNER_TEMP/diagnostic-lifecycle"
      - name: Refresh the normal role before unconditional owned cleanup
        if: always() && inputs.stage == 'lifecycle' && steps.inputs.outcome == 'success' && steps.validate.outcome == 'success'
        id: cleanup_role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.FSS_REHEARSAL_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: diagnostic-cleanup-${{ github.run_id }}
      - name: Clean exact owned lease after expiry failure or cancellation
        if: always() && steps.cleanup_role.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
        run: |
          set -euo pipefail
          node infra/scripts/diagnostic-lifecycle.mjs cleanup \
            "$RUNNER_TEMP/diagnostic-inputs/lease.json" "$REVIEWED_SHA256" "$RUNNER_TEMP/diagnostic-lifecycle"
      - name: Remove private local inputs and plaintext working files
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/diagnostic-inputs" "$RUNNER_TEMP/diagnostic-proposal" "$RUNNER_TEMP/diagnostic-lifecycle"
