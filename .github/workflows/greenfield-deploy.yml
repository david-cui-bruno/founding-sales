name: Greenfield deploy

# Deploys an app-only change to production by itself (lane g91; P6, 27 September 2026),
# unless a commit since production's is a schema, infrastructure, release-script or
# workflow change, which keeps the manual path (docs/greenfield/release.md 4).
#   gates      no credential: a green images publish of a push to main; `deploy.sh ci gates`
#              (the gate green on that push, the commit on main; else `manual`).
#   deploy     id-token: this file's guard, then only infra/scripts: download, check, record
#              --before-rollout (the first write), images.sh promote, deploy (worker, then
#              API), canary. Each production write reads the gate again, held to gates' run.
#   smoke      no credential: scripts/productionSmoke.mjs against the public origin.
#   read-back  id-token, after the smoke: the deploy job's exact record must answer `existing`.
# Provenance without a clock (P6): IMMUTABLE rehearsal repositories, a tag reused only as its
# run's own, a pulled-by-digest check, an artifact bound to its run, digests held to the tag;
# no ECR repository policy (the rehearsal deploy role's namespace limits who pushes fss-rh-*).

on:
  workflow_run:
    workflows: [Greenfield images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      images_run_id:
        description: 'The Greenfield images run (a green publish of a push to main) whose fss-image-digests to deploy'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: fss-production-deploy
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  AWS_REGION: ${{ vars.FSS_AWS_REGION || 'us-east-1' }}
  FSS_PRODUCTION_ORIGIN: ${{ vars.FSS_PRODUCTION_ORIGIN || 'https://api.usecallie.com' }}
  CLUSTER_NAME: ${{ vars.FSS_PRODUCTION_CLUSTER_NAME }}
  OPERATIONS_FAMILY: ${{ vars.FSS_PRODUCTION_OPERATIONS_TASK_FAMILY }}
  TASK_SUBNETS: ${{ vars.FSS_PRODUCTION_TASK_SUBNET_IDS }}
  TASK_SECURITY_GROUP: ${{ vars.FSS_PRODUCTION_TASK_SECURITY_GROUP_ID }}

jobs:
  gates:
    name: The images run, the gate on its commit, and main
    # Any dispatch, so one from another ref fails below with the reason rather than skipping.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.run.outputs.commit }}
      run_id: ${{ steps.run.outputs.run_id }}
      run_attempt: ${{ steps.run.outputs.run_attempt }}
      decision: ${{ steps.gates.outputs.decision }}
      reason: ${{ steps.gates.outputs.reason }}
      gate_run_id: ${{ steps.gates.outputs.gate_run_id }}
    steps:
      - name: The images run is a green publish of a push to main
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.images_run_id }}
        run: |
          set -euo pipefail
          [ "${GITHUB_EVENT_NAME:-}" != workflow_dispatch ] || [ "${GITHUB_REF:-}" = refs/heads/main ] \
            || { echo "::error::dispatched from ${GITHUB_REF:-an unknown ref}: only a dispatch from main deploys (production-deploy admits main alone). Nothing was read or deployed."; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::'$RUN_ID' is not a workflow run id"; exit 1; }
          fields="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq \
            '[.path, .event, .head_branch, .conclusion, .head_repository.full_name, .head_sha, .run_attempt] | map(if . == null or . == "" then "-" else tostring end) | @tsv')"
          IFS=$'\t' read -r path event branch conclusion repository commit attempt <<<"$fields"
          problems=''
          [ "${path%%@*}" = .github/workflows/greenfield-images.yml ] || problems="$problems; it is a run of $path, not of greenfield-images.yml"
          [ "$event $branch" = 'push main' ] || problems="$problems; it ran for a $event on $branch, not a push to main"
          [ "$conclusion" = success ] || problems="$problems; it concluded $conclusion"
          [ "$repository" = "$GITHUB_REPOSITORY" ] || problems="$problems; it built another repository's commit"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || problems="$problems; it names no commit"
          [[ "$attempt" =~ ^[0-9]{1,4}$ ]] || problems="$problems; it names no attempt"
          [ -z "$problems" ] || { echo "::error::the images run cannot be deployed: ${problems#; }"; exit 1; }
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$commit" "$RUN_ID" "$attempt" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.run.outputs.commit }}
          sparse-checkout: infra/scripts
          persist-credentials: false

      - name: The gate green on the images commit, and the commit still on main
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.run.outputs.commit }}
        run: infra/scripts/deploy.sh ci gates --commit "$COMMIT" --wait-minutes 30

  deploy:
    name: Deploy an app-only change to production
    needs: gates
    if: needs.gates.outputs.decision == 'pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 110  # a put of up to 20 minutes, two rollouts of up to 3 ten-minute waits
    environment: production-deploy
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      decision: ${{ steps.guard.outputs.decision == 'manual' && 'manual' || steps.check.outputs.decision }}
      reason: ${{ steps.guard.outputs.decision == 'manual' && steps.guard.outputs.reason || steps.check.outputs.reason }}
      worker: ${{ steps.deploy.outputs.worker_task_definition }}
      api: ${{ steps.deploy.outputs.api_task_definition }}
      previous: ${{ steps.deploy.outputs.previous_worker_task_definition }} ${{ steps.deploy.outputs.previous_api_task_definition }}
      observed: ${{ steps.deploy.outputs.observed_worker_task_definition }} ${{ steps.deploy.outputs.observed_api_task_definition }}
      expect_sending: ${{ steps.deploy.outputs.expect_sending }}
      canary_age: ${{ steps.deploy.outputs.canary_age }}
      record: ${{ steps.record.outputs.release_record_reference }} ${{ steps.record.outputs.release_record_outcome }}
      release_record: ${{ steps.record.outputs.release_record_base64 }}
    env:
      COMMIT: ${{ needs.gates.outputs.commit }}
      RUN_ID: ${{ needs.gates.outputs.run_id }}
      RUN_ATTEMPT: ${{ needs.gates.outputs.run_attempt }}
      GATE_RUN_ID: ${{ needs.gates.outputs.gate_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse any ambient cloud credential, and scalars that are not what they claim
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE; do
            [ -z "${!name:-}" ] || { echo "::error::$name is set before the production CI deploy role was assumed."; exit 1; }
          done
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[0-9]{1,20}$ && "$RUN_ATTEMPT" =~ ^[0-9]{1,4}$ && "$GATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] \
            || { echo "::error::the gates job's commit, run, attempt or gate run is malformed"; exit 1; }

      # The images commit and its history. Nothing in it runs before the guard has passed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.gates.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assume the production CI deploy role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.FSS_PRODUCTION_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fss-prod-ci-deploy-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: The session is exactly this run's session of the CI role, in the production region
        env:
          ROLE_ARN: ${{ secrets.FSS_PRODUCTION_CI_ROLE_ARN }}
          EXPECTED_REGION: ${{ vars.FSS_PRODUCTION_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/fss-prod-ci-deploy$ ]] \
            || { echo "::error::FSS_PRODUCTION_CI_ROLE_ARN is not arn:aws:iam::<account>:role/fss-prod-ci-deploy"; exit 1; }
          [ "$AWS_REGION" = "$EXPECTED_REGION" ] || { echo "::error::this job is configured for $AWS_REGION, production is in $EXPECTED_REGION"; exit 1; }
          identity="$(aws sts get-caller-identity --query Arn --output text)"
          [ "$identity" = "arn:aws:sts::${BASH_REMATCH[1]}:assumed-role/fss-prod-ci-deploy/fss-prod-ci-deploy-${GITHUB_RUN_ID}" ] \
            || { echo "::error::the session is $identity, not this run's session of $ROLE_ARN"; exit 1; }

      # Production's commit (its digests' ci-<commit> tags), then each commit since, renames off.
      - name: Protected paths in any commit since production's
        id: guard
        run: |
          set -euo pipefail
          identity="$(aws sts get-caller-identity --query Arn --output text)"
          account="${identity#arn:aws:sts::}"
          account="${account%%:*}"
          [[ "$account" =~ ^[0-9]{12}$ ]] || { echo "::error::the session names no account"; exit 1; }
          cluster="arn:aws:ecs:${AWS_REGION}:${account}:cluster/fss-prod-cluster"
          work="$RUNNER_TEMP/guard"
          mkdir -p "$work"
          manual() {
            printf 'decision=manual\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not deployed by CI; the manual path applies::$1"
            exit 0
          }
          : > "$work/production-commits"
          for service in worker api; do
            definition="$(aws ecs describe-services --cluster "$cluster" --services "fss-prod-$service" --output json \
              | jq -r '.services | if length == 1 then .[0].taskDefinition // "" else "" end')"
            [ -n "$definition" ] || { echo "::error::ECS does not describe fss-prod-$service"; exit 1; }
            image="$(aws ecs describe-task-definition --task-definition "$definition" --output json \
              | jq -r --arg name "$service" '[.taskDefinition.containerDefinitions[]? | select(.name == $name) | .image][0] // ""')"
            [[ "$image" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/fss-prod-$service@(sha256:[0-9a-f]{64})$ ]] \
              || { echo "::error::fss-prod-$service does not run an fss-prod image by digest"; exit 1; }
            digest=${BASH_REMATCH[1]}
            commits="$(aws ecr describe-images --repository-name "fss-prod-$service" --image-ids "imageDigest=$digest" --output json \
              | jq -r '[.imageDetails[0].imageTags[]? | capture("^(ci-)?(?<c>[0-9a-f]{40})(-image)?$").c] | unique | join(" ")')"
            [ -n "$commits" ] || manual "cannot tell which commit production's $service image was built from: fss-prod-$service@$digest carries no ci-<commit> or commit tag"
            for built in $commits; do
              git cat-file -e "${built}^{commit}" 2>/dev/null \
                || manual "production's $service image was built from $built, which is not in this repository's history"
              git merge-base --is-ancestor "$built" "$COMMIT" \
                || manual "production's $service image was built from $built, which is not an ancestor of $COMMIT: these images would not move production forward"
              echo "production's $service image was built from $built"
              echo "$built" >> "$work/production-commits"
            done
          done
          : > "$work/paths"
          for built in $(sort -u "$work/production-commits"); do
            git -c core.quotePath=false log --no-renames --no-ext-diff --no-textconv --format= --name-only \
              --diff-merges=first-parent "$built..$COMMIT" >> "$work/paths"
          done
          sort -u "$work/paths" | sed '/^$/d' > "$work/touched"
          echo "$(wc -l < "$work/touched" | tr -d ' ') path(s) touched by the commits since production's"
          # Application code deploys; everything else, an unknown path included, is manual.
          : > "$work/protected"
          while IFS= read -r path; do
            case "$path" in
              infra/*) why='infrastructure, and every release script in infra/scripts' ;;
              packages/domain/db/migrations/*) why='a migration, which is a schema change' ;;
              # Lane A1: check compares ranges, so how a version is accepted is protected too.
              packages/domain/db/schemaRange.ts) why='the schema acceptance rule' ;;
              packages/domain/db/migrationRunner.ts) why='the migration runner, which schema acceptance reads the version through' ;;
              packages/domain/db/queryable.ts) why='the session helpers the migration runner applies migrations with' ;;
              .github/*) why='a workflow' ;;
              scripts/productionSmoke.mjs) why='the production smoke this deploy is judged by' ;;
              scripts/*[Rr]elease*) why='a release script' ;;
              apps/* | packages/* | scripts/* | docs/* | test/* | tests/*) why='' ;;
              Dockerfile.api | Dockerfile.worker | Dockerfile.api.dockerignore | Dockerfile.worker.dockerignore) why='' ;;
              package.json | package-lock.json | certs/*) why='' ;;
              tsconfig*.json | eslint*.mjs | README.md) why='' ;;
              *) why='not an application path this deploy knows' ;;
            esac
            [ -z "$why" ] || printf '%s (%s)\n' "$path" "$why" >> "$work/protected"
          done < "$work/touched"
          if [ -s "$work/protected" ]; then
            { echo '### Paths that keep this release on the manual path'; echo ''; sed 's/^/- /' "$work/protected"; } >> "$GITHUB_STEP_SUMMARY"
            first="$(head -3 "$work/protected" | paste -sd ';' - | sed 's/;/; /g')"
            manual "the commits since production's touch $(wc -l < "$work/protected" | tr -d ' ') path(s) that are not application code: $first. Release this one by hand (release.md 4); the next app merge after it deploys itself"
          fi
          echo "decision=pass" >> "$GITHUB_OUTPUT"
          echo "no protected path in any commit since production's"

      - name: Download the digests and decide - app-only, already running, or the manual path
        id: check
        if: steps.guard.outputs.decision == 'pass'
        run: |
          set -euo pipefail
          infra/scripts/deploy.sh ci download --run-id "$RUN_ID" --commit "$COMMIT" --out "$RUNNER_TEMP/image-digests.json"
          infra/scripts/deploy.sh ci check --digests "$RUNNER_TEMP/image-digests.json" --commit "$COMMIT" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --origin "$FSS_PRODUCTION_ORIGIN"

      # The first write: a worker sends only under a stored record naming its digest.
      - name: Put the ci-gate release record, before the rollout
        id: record
        if: steps.check.outputs.decision == 'deploy'
        run: |
          set -euo pipefail
          infra/scripts/deploy.sh ci record --before-rollout --digests "$RUNNER_TEMP/image-digests.json" \
            --commit "$COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --gate-run-id "$GATE_RUN_ID" --cluster-name "$CLUSTER_NAME" \
            --operations-family "$OPERATIONS_FAMILY" --subnets "$TASK_SUBNETS" --security-group "$TASK_SECURITY_GROUP"

      - name: Promote both images, roll the worker and then the API to their digests, read the canary
        id: deploy
        if: steps.check.outputs.decision == 'deploy'
        run: |
          set -euo pipefail
          infra/scripts/images.sh promote "$RUNNER_TEMP/image-digests.json" --gate-run-id "$GATE_RUN_ID"
          infra/scripts/deploy.sh ci deploy --digests "$RUNNER_TEMP/image-digests.json" \
            --commit "$COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --gate-run-id "$GATE_RUN_ID"
          infra/scripts/deploy.sh ci canary

  smoke:
    name: Production smoke, with no credential
    needs: [gates, deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.decision == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.gates.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Six checks against the running API
        env:
          CANARY_AGE: ${{ needs.deploy.outputs.canary_age }}
          EXPECT_SENDING: ${{ needs.deploy.outputs.expect_sending }}
        run: |
          set -euo pipefail
          [[ "$CANARY_AGE" =~ ^[0-9]{1,7}(\.[0-9]{1,6})?$ ]] || { echo "::error::the canary age '$CANARY_AGE' is not a number"; exit 1; }
          [[ "$EXPECT_SENDING" =~ ^(disabled|enabled)$ ]] || { echo "::error::the deploy reported no sending state ('$EXPECT_SENDING')"; exit 1; }
          for attempt in 1 2 3; do
            NODE_OPTIONS="--experimental-transform-types --disable-warning=ExperimentalWarning" \
              node scripts/productionSmoke.mjs --origin "$FSS_PRODUCTION_ORIGIN" \
                --canary-age-seconds "$CANARY_AGE" --expect-sending "$EXPECT_SENDING" && exit 0
            echo "smoke attempt $attempt of 3 did not pass"
            [ "$attempt" -eq 3 ] || sleep 60
          done
          echo "::error::the production smoke did not pass. The new revisions are running; the summary names them."
          exit 1

  # After the smoke. The deploy job's guard showed infra/scripts unchanged since production's.
  read-back:
    name: Read the release record back, after the smoke
    needs: [gates, deploy, smoke]
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      read_back: ${{ steps.read-back.outputs.release_record_outcome }}
    env:
      COMMIT: ${{ needs.gates.outputs.commit }}
      RUN_ID: ${{ needs.gates.outputs.run_id }}
      RUN_ATTEMPT: ${{ needs.gates.outputs.run_attempt }}
      GATE_RUN_ID: ${{ needs.gates.outputs.gate_run_id }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_RECORD: ${{ needs.deploy.outputs.release_record }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.gates.outputs.commit }}
          sparse-checkout: infra/scripts
          persist-credentials: false

      - name: Assume the production CI deploy role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.FSS_PRODUCTION_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fss-prod-ci-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Read the release record back, the exact bytes put, which must answer existing
        id: read-back
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_RECORD" | base64 -d > "$RUNNER_TEMP/release-record.json"
          infra/scripts/deploy.sh ci download --run-id "$RUN_ID" --commit "$COMMIT" --out "$RUNNER_TEMP/image-digests.json"
          infra/scripts/deploy.sh ci record --after-rollout --release-record "$RUNNER_TEMP/release-record.json" --digests "$RUNNER_TEMP/image-digests.json" \
            --commit "$COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --gate-run-id "$GATE_RUN_ID" --cluster-name "$CLUSTER_NAME" \
            --operations-family "$OPERATIONS_FAMILY" --subnets "$TASK_SUBNETS" --security-group "$TASK_SECURITY_GROUP"

  summary:
    name: One line
    needs: [gates, deploy, smoke, read-back]
    if: always() && needs.gates.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: One line
        env:
          COMMIT: ${{ needs.gates.outputs.commit }}
          GATES_RESULT: ${{ needs.gates.result }}
          GATES_DECISION: ${{ needs.gates.outputs.decision }}
          GATES_REASON: ${{ needs.gates.outputs.reason }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          READ_BACK_RESULT: ${{ needs.read-back.result }}
          DECISION: ${{ needs.deploy.outputs.decision }}
          REASON: ${{ needs.deploy.outputs.reason }}
          WORKER: ${{ needs.deploy.outputs.worker }}
          API: ${{ needs.deploy.outputs.api }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
          OBSERVED: ${{ needs.deploy.outputs.observed }}
          RECORD: ${{ needs.deploy.outputs.record }}
          READ_BACK: ${{ needs.read-back.outputs.read_back }}
        run: |
          set -euo pipefail
          short="${COMMIT:0:8}"
          level=notice
          if [ "$GATES_RESULT" = success ] && [ "$GATES_DECISION" = manual ]; then
            line="Not deployed: $GATES_REASON. The manual path applies (docs/greenfield/release.md 4)."
          elif [ "$DEPLOY_RESULT" != success ] || { [ "$DECISION" = deploy ] && [ "$SMOKE_RESULT $READ_BACK_RESULT" != 'success success' ]; }; then
            level=error
            line="Production deploy of ${short:-an unknown commit} FAILED (gates ${GATES_RESULT:-not run}, deploy ${DEPLOY_RESULT:-not run}, smoke ${SMOKE_RESULT:-not run}, read-back ${READ_BACK_RESULT:-not run}, decision ${DECISION:-none})."
            [ -z "${PREVIOUS// /}" ] || line="$line Before: $PREVIOUS."
            [ -z "${OBSERVED// /}" ] || line="$line Observed after the failure: $OBSERVED."
            [ -z "${RECORD// /}" ] || line="$line Release record: $RECORD before the rollout, ${READ_BACK:-not read back} after the smoke."
          else
            case "$DECISION" in
              deploy) line="Deployed $short to production: release record $RECORD before the rollout and $READ_BACK after the smoke passed, worker ${WORKER##*/}, api ${API##*/}, each held to its digest." ;;
              current) line="Production already runs $short. Nothing deployed." ;;
              manual) line="Not deployed: $REASON. The manual path applies (docs/greenfield/release.md 4)." ;;
              *) line="Nothing decided." ;;
            esac
          fi
          echo "::$level::$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
