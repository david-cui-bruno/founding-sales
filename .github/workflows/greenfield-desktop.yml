name: Greenfield desktop

# The macOS half of specification 16.1: "the Electron macOS artifact and host
# integrations are tested on macOS".
#
# Two jobs, and the difference between them is the whole design.
#
#   host     always runs, needs no credential at all, and proves the things a
#            Linux job cannot: the real Keychain, a real packaged bundle that
#            starts, real Launch Services, and a package verifier that refuses
#            an unsigned, tampered or ad-hoc build.
#
#   release  runs only when asked, needs every Apple secret David sets, and
#            fails closed and by name when one is missing. It is the real path:
#            Developer ID, hardened runtime, notarization, stapling, a signed
#            update manifest, and an artifact a person can download from the run.
#            It reaches no cloud: publishing to the channel is David's operator
#            step, because no AWS credential exists in this repository.
#
# No step prints a secret. Values reach `codesign`, `notarytool` and Node
# through the environment or through a file the runner deletes; nothing is
# echoed, no step sets `-x`, and `describeSigningPlan` (apps/desktop/scripts/
# signing.ts) is the only thing that describes the configuration, by variable
# name. A test asserts that its output contains no value.
#
# `apps/desktop/test/packaging/releaseWorkflow.test.ts` reads this file on every
# change: every action pinned to a commit sha, every secret only ever the value
# of an env entry named after it, the dirty-tree refusal before the build, and
# the host job holding no credential at all.

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/greenfield-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'package-lock.json'
      - '.github/workflows/greenfield-desktop.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build, sign, notarize and staple a release. Needs every Apple secret.'
        type: boolean
        default: false
      desktop_commit_stamp:
        description: 'The commit the release record names. Must equal the commit this run is on; leave empty before the rehearsal has run.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  host:
    # arm64. The product ships one architecture and the fuses, the Mach-O check
    # and the launch would all pass vacuously on an Intel runner.
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Assert this is an arm64 Mac
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "arch=$arch"
          test "$arch" = "arm64"

      - name: Refuse a signing credential in the unsigned job
        run: |
          set -euo pipefail
          # This job must behave identically whether or not the repository holds
          # the Apple secrets. If one is visible here the workflow has been
          # changed in a way this lane did not intend, so stop rather than
          # produce something that looks signed and was not verified as such.
          for name in FSS_MAC_CERTIFICATE_P12 FSS_MAC_SIGNING_IDENTITY FSS_APPLE_APP_SPECIFIC_PASSWORD \
                      FSS_UPDATE_SIGNING_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set in the unsigned host job."
              exit 1
            fi
          done

      - name: Install
        run: |
          set -euo pipefail
          # --ignore-scripts: the Electron binary is the one install script this
          # job needs, and the next step runs it explicitly.
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch the Electron binary
        run: |
          set -euo pipefail
          # The one install script this job does need. `npm rebuild electron`
          # does not run it under the repository's allow-scripts policy.
          node node_modules/electron/install.js
          test -d node_modules/electron/dist/Electron.app

      - name: Desktop rules and window layers
        run: |
          set -euo pipefail
          npm run typecheck --workspace apps/desktop
          npm run test --workspace apps/desktop

      - name: Host integrations on a real Mac
        run: |
          set -euo pipefail
          # Keychain round trip, a packaged bundle that launches, Launch
          # Services registration, and the verifier refusing what it should.
          npm run test:desktop:host

      - name: The verifier refuses an unsigned build, from the command line too
        run: |
          set -euo pipefail
          # The same refusal the tests assert, through the entry point an
          # operator would use, so the exit status is proven and not just the
          # function's return value.
          FSS_DESKTOP_PACKAGE_MODE=local-smoke npm run package:desktop -- "$RUNNER_TEMP/smoke"
          app="$(find "$RUNNER_TEMP/smoke" -maxdepth 2 -name 'Callie.app' -print -quit)"
          test -n "$app"
          if npm run verify:desktop:package -- "$app"; then
            echo "::error::the package verifier accepted an ad-hoc smoke build as a release"
            exit 1
          fi
          npm run verify:desktop:package -- "$app" --integrity

  release:
    # Only on request. There is nothing to sign on an ordinary pull request, and
    # notarization is a round trip to Apple that takes minutes.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: macos-15
    timeout-minutes: 90
    environment: desktop-release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Every secret this release needs, by name
        env:
          FSS_MAC_SIGNING_IDENTITY: ${{ secrets.FSS_MAC_SIGNING_IDENTITY }}
          FSS_MAC_TEAM_ID: ${{ secrets.FSS_MAC_TEAM_ID }}
          FSS_APPLE_ID: ${{ secrets.FSS_APPLE_ID }}
          FSS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.FSS_APPLE_APP_SPECIFIC_PASSWORD }}
          FSS_UPDATE_PUBLIC_KEY: ${{ secrets.FSS_UPDATE_PUBLIC_KEY }}
          FSS_MAC_CERTIFICATE_P12: ${{ secrets.FSS_MAC_CERTIFICATE_P12 }}
          FSS_MAC_CERTIFICATE_PASSWORD: ${{ secrets.FSS_MAC_CERTIFICATE_PASSWORD }}
          FSS_MAC_KEYCHAIN_PASSWORD: ${{ secrets.FSS_MAC_KEYCHAIN_PASSWORD }}
          FSS_UPDATE_SIGNING_KEY: ${{ secrets.FSS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # Names only. `${!name}` reads the value to test whether it is empty
          # and never prints it; GitHub would mask it anyway, and relying on
          # that is not a reason to write it.
          missing=()
          for name in FSS_MAC_SIGNING_IDENTITY FSS_MAC_TEAM_ID FSS_APPLE_ID \
                      FSS_APPLE_APP_SPECIFIC_PASSWORD FSS_UPDATE_PUBLIC_KEY \
                      FSS_MAC_CERTIFICATE_P12 FSS_MAC_CERTIFICATE_PASSWORD \
                      FSS_MAC_KEYCHAIN_PASSWORD FSS_UPDATE_SIGNING_KEY; do
            [ -z "${!name:-}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::this release cannot be signed; absent repository secrets: ${missing[*]}"
            exit 1
          fi
          echo "every required secret is present"

      - name: Every variable this release needs, by name
        env:
          FSS_API_BASE_URL: ${{ vars.FSS_API_BASE_URL }}
          FSS_UPDATE_CHANNEL_URL: ${{ vars.FSS_UPDATE_CHANNEL_URL }}
          FSS_DESKTOP_APP_VERSION: ${{ vars.FSS_DESKTOP_APP_VERSION }}
        run: |
          set -euo pipefail
          # These three are public — two hostnames and a version — and each is
          # compiled into the bundle. A build missing one is not a release that
          # somebody could fix afterwards: the values are inside the signature.
          #
          # FSS_UPDATE_CHANNEL_URL is the one that is normally absent, and the
          # reason is in the order rather than in a mistake: the CloudFront
          # hostname exists only after the first production apply, and GitHub
          # will not hold an empty variable. Until then a release cannot be
          # built, because a build with no channel installs once and never
          # updates. docs/greenfield/release.md section 2 has the order.
          missing=()
          for name in FSS_API_BASE_URL FSS_UPDATE_CHANNEL_URL FSS_DESKTOP_APP_VERSION; do
            [ -z "${!name:-}" ] && missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::this release cannot be built; absent repository variables: ${missing[*]}"
            exit 1
          fi
          # The workspace placeholder. 0.0.0 is below every minimum the API could
          # publish, so it would ship a client that cannot mutate and cannot be
          # upgraded past itself (specification 5.3).
          if [ "$FSS_DESKTOP_APP_VERSION" = "0.0.0" ]; then
            echo "::error::FSS_DESKTOP_APP_VERSION is 0.0.0, which is the placeholder, not a release version"
            exit 1
          fi
          echo "every required variable is present"

      - name: This build is of the commit the release record names
        env:
          DESKTOP_COMMIT_STAMP: ${{ inputs.desktop_commit_stamp }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Specification 16.2: "the deployed commit/image digests match the
          # rehearsal artifacts". The rehearsal records a `desktop_commit_stamp`;
          # the stamp inside this bundle's asar has to be the same commit, and
          # the cheapest place to find out is before ninety minutes of building
          # and notarizing rather than after.
          #
          # Empty is allowed, because the first release of a commit may be built
          # before the rehearsal has run against it. It is then recorded, not
          # compared, and the comparison happens in the other direction: David
          # passes this run's commit to the rehearsal.
          echo "release commit: $RELEASE_COMMIT"
          if [ -n "$DESKTOP_COMMIT_STAMP" ] && [ "$DESKTOP_COMMIT_STAMP" != "$RELEASE_COMMIT" ]; then
            echo "::error::desktop_commit_stamp ($DESKTOP_COMMIT_STAMP) is not the commit this run is on ($RELEASE_COMMIT)"
            exit 1
          fi

      - name: Install
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          FSS_MAC_CERTIFICATE_P12: ${{ secrets.FSS_MAC_CERTIFICATE_P12 }}
          FSS_MAC_CERTIFICATE_PASSWORD: ${{ secrets.FSS_MAC_CERTIFICATE_PASSWORD }}
          FSS_MAC_KEYCHAIN_PASSWORD: ${{ secrets.FSS_MAC_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fss-release.keychain-db"
          certificate="$RUNNER_TEMP/fss-certificate.p12"
          # The certificate exists on disk for the length of one import and is
          # overwritten before it is unlinked, because a deleted file on a
          # runner image is still a file until the volume goes.
          printf '%s' "$FSS_MAC_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$FSS_MAC_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$FSS_MAC_KEYCHAIN_PASSWORD" "$keychain"
          # `-P` puts the passphrase in this process's argument vector for the
          # length of one import. `security import` offers no other way to give
          # it, and this runner is ephemeral and single-tenant.
          security import "$certificate" -k "$keychain" -P "$FSS_MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -x
          dd if=/dev/zero of="$certificate" bs=1 count="$(stat -f%z "$certificate")" conv=notrunc 2>/dev/null
          rm -f "$certificate"
          # Without this, codesign raises a modal dialog for the private key and
          # a headless runner waits for a click that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$FSS_MAC_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          # Identities, by count. `find-identity` prints certificate names, and
          # a Developer ID name contains the team identifier.
          count="$(security find-identity -v -p codesigning "$keychain" | grep -c 'Developer ID Application' || true)"
          echo "developer id identities available: $count"
          test "$count" -ge 1

      - name: The tree this is built from is the tree that was committed
        run: |
          set -euo pipefail
          # `packageDesktop` refuses a dirty tree too, and the stamp schema
          # refuses `channel: release` with `dirty: true`, so this is the third
          # lock on the same door. It is here because it is the one that fails
          # in five seconds and names the files, rather than after the install
          # and inside a build script's error message.
          #
          # `npm ci` is the step most able to have changed something: a
          # lifecycle script, a rewritten lockfile, a generated file. It has
          # already run.
          if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
            echo "::error::the working tree is not clean, so this build cannot claim a commit"
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi
          echo "clean at $(git rev-parse HEAD)"

      - name: Build, sign, notarize and staple
        env:
          FSS_DESKTOP_PACKAGE_MODE: release
          FSS_MAC_SIGNING_IDENTITY: ${{ secrets.FSS_MAC_SIGNING_IDENTITY }}
          FSS_MAC_TEAM_ID: ${{ secrets.FSS_MAC_TEAM_ID }}
          FSS_APPLE_ID: ${{ secrets.FSS_APPLE_ID }}
          FSS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.FSS_APPLE_APP_SPECIFIC_PASSWORD }}
          FSS_UPDATE_PUBLIC_KEY: ${{ secrets.FSS_UPDATE_PUBLIC_KEY }}
          FSS_API_BASE_URL: ${{ vars.FSS_API_BASE_URL }}
          FSS_UPDATE_CHANNEL_URL: ${{ vars.FSS_UPDATE_CHANNEL_URL }}
          FSS_DESKTOP_APP_VERSION: ${{ vars.FSS_DESKTOP_APP_VERSION }}
        run: |
          set -euo pipefail
          npm run package:desktop -- "$RUNNER_TEMP/release"

      - name: Verify the release the way a person receiving it would
        env:
          FSS_EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/release" -maxdepth 2 -name 'Callie.app' -print -quit)"
          test -n "$app"
          # Signature, Developer ID authority, hardened runtime, secure
          # timestamp, entitlements, fuses, stapled ticket, Gatekeeper, the
          # commit stamp, the embedded update key — and, since G13b, that every
          # window declared in BUNDLE_WINDOWS actually resolves inside the
          # packaged asar, and that nothing was packed the closed scheme map
          # will not serve.
          npm run verify:desktop:package -- "$app"

      - name: Sign the update manifest
        env:
          FSS_UPDATE_SIGNING_KEY: ${{ secrets.FSS_UPDATE_SIGNING_KEY }}
          FSS_UPDATE_CHANNEL_URL: ${{ vars.FSS_UPDATE_CHANNEL_URL }}
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/release" -maxdepth 2 -name 'Callie.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/channel"
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            apps/desktop/scripts/publishUpdate.ts "$app" "$RUNNER_TEMP/channel"

      - name: The stamp inside the bundle is this commit
        env:
          DESKTOP_COMMIT_STAMP: ${{ inputs.desktop_commit_stamp }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The manifest's `commitSha` is read out of the release stamp, which is
          # inside the asar and therefore inside the signature — so this compares
          # the signed artifact with the commit, not the build log with itself.
          #
          # The first comparison is the one specification 16.2 asks for: the
          # thing rehearsed and the thing published are one commit. The second
          # repeats the input check against the artifact rather than against the
          # workflow's idea of it.
          manifest="$RUNNER_TEMP/channel/latest.json"
          stamped="$(node -e 'process.stdout.write(require(process.argv[1]).manifest.commitSha)' "$manifest")"
          if [ "$stamped" != "$RELEASE_COMMIT" ]; then
            echo "::error::the bundle is stamped $stamped and this run is on $RELEASE_COMMIT"
            exit 1
          fi
          if [ -n "$DESKTOP_COMMIT_STAMP" ] && [ "$stamped" != "$DESKTOP_COMMIT_STAMP" ]; then
            echo "::error::the bundle is stamped $stamped and the release record names $DESKTOP_COMMIT_STAMP"
            exit 1
          fi
          echo "stamp, commit and release record agree on $stamped"

      - name: Record what was built
        run: |
          set -euo pipefail
          # Public facts only: a version, a commit, a digest and a byte count.
          # Enough to compare a later hand-built artifact of the same commit
          # against this one — the zip's own digest will differ, because a
          # notarization ticket is stapled per submission, which is why the
          # manifest carries the digest of the artifact actually published.
          manifest="$RUNNER_TEMP/channel/latest.json"
          version="$(node -e 'process.stdout.write(require(process.argv[1]).manifest.releaseVersion)' "$manifest")"
          commit="$(node -e 'process.stdout.write(require(process.argv[1]).manifest.commitSha)' "$manifest")"
          digest="$(node -e 'process.stdout.write(require(process.argv[1]).manifest.artifact.sha256)' "$manifest")"
          size="$(node -e 'process.stdout.write(String(require(process.argv[1]).manifest.artifact.sizeBytes))' "$manifest")"
          {
            echo "### Callie macOS arm64"
            echo ""
            echo "- version: \`$version\`"
            echo "- commit: \`$commit\`"
            echo "- artifact sha256: \`$digest\`"
            echo "- artifact bytes: \`$size\`"
            echo "- channel path: \`releases/darwin-arm64/latest.json\`"
            echo "- download: the \`callie-macos-arm64-$version\` artifact on this run"
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v4.6.2. Resolved on 20 September 2026 with
      # `git ls-remote --tags https://github.com/actions/upload-artifact.git`:
      # refs/tags/v4.6.2 and refs/tags/v4 both name this object, and neither has
      # a peeled `^{}` entry, so it is a commit and not an annotated tag.
      # docs/decisions/g13b-the-artifact-leaves-on-a-pinned-action.md.
      #
      # This is how the release leaves the runner. The alternative — an OIDC
      # role that writes straight to the bucket — is better and belongs to the
      # lane that owns AWS identity; it is not a thing to improvise on a runner
      # holding a Developer ID certificate. David downloads the zip and the
      # manifest and publishes them himself, which keeps the one step that
      # changes what every Mac installs a deliberate act.
      #
      # `compression-level: 0` because the zip is already compressed and
      # upload-artifact would zip it again; retention is the GitHub maximum for
      # a private repository, so a release stays downloadable for a quarter.
      - name: Carry the release off the runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: callie-macos-arm64-${{ vars.FSS_DESKTOP_APP_VERSION }}
          path: ${{ runner.temp }}/channel
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Remove the temporary keychain
        if: always()
        run: |
          set -euo pipefail
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/fss-release.keychain-db" || true

# ---------------------------------------------------------------------------
# Publishing, which happens outside CI because no AWS credential exists here.
#
# Download the `callie-macos-arm64-<version>` artifact from the run; it holds
# `Callie-<version>-arm64.zip` and `latest.json`. GitHub wraps a download in a
# zip of its own, so there is one unzip before these commands. Then, against a
# directive, with an operator's session:
#
#   aws s3 cp "Callie-$VERSION-arm64.zip" \
#     "s3://$BUCKET/releases/darwin-arm64/$VERSION/Callie-$VERSION-arm64.zip"
#   aws s3 cp latest.json \
#     "s3://$BUCKET/releases/darwin-arm64/latest.json" \
#     --cache-control 'max-age=300'
#   aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
#     --paths '/releases/darwin-arm64/latest.json'
#
# The zip goes up first. A manifest that names an object which is not there yet
# is a manifest every Mac refuses, which is safe but looks like an outage.
# `infra/modules/updates` prints `bucket_name` and `distribution_id`.
# ---------------------------------------------------------------------------
