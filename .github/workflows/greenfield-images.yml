name: Greenfield images

# Builds the two linux/arm64 container images, verifies them, and on main publishes
# them to the two rehearsal repositories by digest.
#
# The build proves three things that a unit test cannot: the production
# dependency set is enough to load the process, the entry point runs on Node
# 24 with no build step, and the image is arm64 — which is what the task
# definition's `runtime_platform` demands and what an x86 image fails at with
# an exec format error long after it looked fine locally.
#
# ## Two jobs, and why the second one holds a credential (lane g74, audit O17)
#
# `images` runs on a pull request. It builds with `--load`, verifies the local
# images with `infra/scripts/release-images.sh verify`, and holds no credential of
# any kind.
#
# `publish` runs on a push to main — only when an image input changed, which is
# what `push.paths` lists and what `release-images.sh inputs` names — and replaces
# the operator's rebuild-and-push. Before g74 the release digests came from a
# second build on David's Mac, so what CI verified and what production ran were two
# builds of one commit. Now:
#
#   * it assumes `fss-rh-deploy` through the `rehearsal` environment, the same OIDC
#     subject and the same role the rehearsal uses. That role already holds `ecr:*`
#     on `repository/fss-rh*` (`infra/policies/deployment-role-policy.json.tftpl`),
#     so no IAM statement and no trust relationship changed, and it cannot write a
#     production repository: `fss-prod-*` is outside its namespace;
#   * it builds and pushes each image once, as `fss-rh-<image>:ci-<commit>`. The
#     repositories are IMMUTABLE, so a re-run of the same run finds the tag and
#     reuses its digest rather than pushing different bytes under it; a first attempt
#     that finds the tag already there fails, because another writer pushed it;
#   * it pulls what it pushed **by digest** and runs the same verification against
#     that, so the digest it publishes is the digest that was verified;
#   * it writes both digests to the step summary and to the artifact
#     `fss-image-digests` (`image-digests.json`, `fss.image-digests.v1`), which names
#     repositories and never a registry host. That artifact is what the weekly
#     rehearsal pins to and what `infra/scripts/release-promote.sh` copies to
#     production from. No file is committed.
#
# Production is never touched here. Copying to `fss-prod-*` is the operator's
# `release-promote.sh`, by digest, with the admin profile.

on:
  pull_request:
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - 'Dockerfile.api.dockerignore'
      - 'Dockerfile.worker.dockerignore'
      - 'apps/**'
      - 'packages/**'
      - 'certs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/greenfield-images.yml'
      - 'infra/scripts/release-images.sh'
  push:
    branches: [main]
    # Exactly `infra/scripts/release-images.sh inputs`, in glob form; the release suite
    # compares the two. A path that changes an image and is missing here is a main
    # commit whose images nobody publishes, and the weekly rehearsal refuses to pin it.
    paths:
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - 'Dockerfile.api.dockerignore'
      - 'Dockerfile.worker.dockerignore'
      - 'apps/**'
      - 'packages/**'
      - 'certs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/greenfield-images.yml'

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.FSS_AWS_REGION || 'us-east-1' }}

jobs:
  images:
    name: Build and verify both images without a credential
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Register the arm64 interpreter
        run: |
          set -euo pipefail
          # The runner is x86_64 and both images are arm64, so every RUN step
          # is emulated. qemu-user-static comes from the distribution rather
          # than from a third-party image, so nothing unpinned runs privileged.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support >/dev/null
          docker buildx create --name fss-images --driver docker-container --use
          docker buildx inspect --bootstrap fss-images

      - name: Assert the builder can produce linux/arm64
        run: |
          set -euo pipefail
          platforms="$(docker buildx inspect fss-images | sed -n 's/^Platforms: *//p')"
          echo "platforms: $platforms"
          case "$platforms" in
            *linux/arm64*) ;;
            *) echo "::error::this builder cannot produce linux/arm64; the images would be built for the wrong architecture"; exit 1 ;;
          esac

      - name: Build both images
        run: |
          set -euo pipefail
          for service in api worker; do
            docker buildx build \
              --builder fss-images \
              --platform linux/arm64 \
              --file "Dockerfile.$service" \
              --build-arg "GIT_REVISION=${GITHUB_SHA}" \
              --provenance=false \
              --tag "fss-$service:ci" \
              --load \
              .
            # A local image's id, not a registry digest: the digest a release names is
            # the one `publish` reads back from the registry on main.
            echo "fss-$service image id: $(docker image inspect "fss-$service:ci" --format '{{.Id}}')"
          done

      - name: Read the schema ranges the images accept
        run: |
          set -euo pipefail
          # From the source rather than from a literal, because the two ranges
          # differ and a lane that widens one must not have to remember this file.
          # packages/domain/db/schemaRange.ts imports only node built-ins, so
          # this needs no install.
          read_range() {
            node --experimental-transform-types --disable-warning=ExperimentalWarning \
              --input-type=module -e "
                const module = await import('./packages/domain/db/schemaRange.ts');
                const range = module['$1'];
                process.stdout.write(String(range.minimum) + ' ' + String(range.maximum));
              "
          }
          read api_min api_max <<<"$(read_range API_SCHEMA_RANGE)"
          read worker_min worker_max <<<"$(read_range WORKER_SCHEMA_RANGE)"
          echo "api=$api_min-$api_max worker=$worker_min-$worker_max"
          {
            echo "API_SCHEMA_MIN=$api_min"
            echo "API_SCHEMA_MAX=$api_max"
            echo "WORKER_SCHEMA_MIN=$worker_min"
            echo "WORKER_SCHEMA_MAX=$worker_max"
          } >> "$GITHUB_ENV"

      - name: Verify both images
        run: |
          set -euo pipefail
          # arm64; --selftest accepts the declared range and refuses one below it; runs
          # as node, never uid 0; no test directory and no development dependency. The
          # same script `publish` runs against the pulled-by-digest image on main.
          infra/scripts/release-images.sh verify fss-api:ci api "$API_SCHEMA_MIN" "$API_SCHEMA_MAX"
          infra/scripts/release-images.sh verify fss-worker:ci worker "$WORKER_SCHEMA_MIN" "$WORKER_SCHEMA_MAX"

  publish:
    name: Publish both images to the rehearsal repositories, by digest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The one OIDC subject `fss-rh-deploy` trusts. If David gives the environment a
    # required reviewer, this job waits for an approval, which is a feature.
    environment: rehearsal
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Refuse any ambient cloud credential before the role is assumed
        run: |
          set -euo pipefail
          # The only credential this job may hold is the one the next steps assume
          # through OIDC. Anything already present is a change nobody reviewed.
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                      AWS_PROFILE AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set before the rehearsal role was assumed."
              exit 1
            fi
          done

      - name: Register the arm64 interpreter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support >/dev/null
          docker buildx create --name fss-images --driver docker-container --use
          docker buildx inspect --bootstrap fss-images
          platforms="$(docker buildx inspect fss-images | sed -n 's/^Platforms: *//p')"
          case "$platforms" in
            *linux/arm64*) ;;
            *) echo "::error::this builder cannot produce linux/arm64"; exit 1 ;;
          esac

      - name: Read the schema ranges the images accept
        run: |
          set -euo pipefail
          read_range() {
            node --experimental-transform-types --disable-warning=ExperimentalWarning \
              --input-type=module -e "
                const module = await import('./packages/domain/db/schemaRange.ts');
                const range = module['$1'];
                process.stdout.write(String(range.minimum) + ' ' + String(range.maximum));
              "
          }
          read api_min api_max <<<"$(read_range API_SCHEMA_RANGE)"
          read worker_min worker_max <<<"$(read_range WORKER_SCHEMA_RANGE)"
          {
            echo "API_SCHEMA_MIN=$api_min"
            echo "API_SCHEMA_MAX=$api_max"
            echo "WORKER_SCHEMA_MIN=$worker_min"
            echo "WORKER_SCHEMA_MAX=$worker_max"
          } >> "$GITHUB_ENV"

      # aws-actions/configure-aws-credentials v4, the pin the rehearsal uses.
      - name: Assume the rehearsal deployment role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.FSS_REHEARSAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fss-rh-images-${{ github.run_id }}

      - name: The assumed identity is the rehearsal role and nothing else
        run: infra/scripts/rehearsal-caller-identity.sh fss-rh-deploy

      - name: Push each image once, as ci-<commit>, and read its digest back
        env:
          API_REPOSITORY: ${{ secrets.FSS_REHEARSAL_API_REPOSITORY }}
          WORKER_REPOSITORY: ${{ secrets.FSS_REHEARSAL_WORKER_REPOSITORY }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA}"
          registry="${API_REPOSITORY%%/*}"
          # Both repositories are the two stable rehearsal ones, in one registry, or
          # nothing is pushed. The secret holds the URI; only its last segment is named.
          [ "${API_REPOSITORY##*/}" = fss-rh-api ] || { echo "::error::the API repository secret does not name fss-rh-api"; exit 1; }
          [ "${WORKER_REPOSITORY##*/}" = fss-rh-worker ] || { echo "::error::the worker repository secret does not name fss-rh-worker"; exit 1; }
          [ "${WORKER_REPOSITORY%%/*}" = "$registry" ] || { echo "::error::the two repositories are in different registries"; exit 1; }
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry" > /dev/null

          for service in api worker; do
            repository="fss-rh-$service"
            uri="$API_REPOSITORY"
            [ "$service" = worker ] && uri="$WORKER_REPOSITORY"
            # The tag is immutable: a re-run of this commit reuses what the first run
            # pushed instead of pushing a second build under the same name.
            set +e
            existing="$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
              --query 'imageDetails[0].imageDigest' --output text 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ] && [[ "$existing" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              # Only a re-run of this run may find its own tag (review of PRs 246 and 247,
              # 26 September 2026): on the first attempt an existing tag was pushed by
              # somebody else, and the deploy's push-time window would accept it as this
              # run's build. Release such a commit by hand (release.md 4.0).
              if [ "${GITHUB_RUN_ATTEMPT:-1}" = 1 ]; then
                echo "::error::$repository:$tag already exists as $existing and this is the first attempt of run $GITHUB_RUN_ID: another writer pushed it, so this run cannot vouch for it. Release the commit by hand."
                exit 1
              fi
              echo "$repository:$tag already exists; reusing $existing (attempt $GITHUB_RUN_ATTEMPT of this run)"
              digest="$existing"
            elif [[ "$existing" == *ImageNotFoundException* ]]; then
              docker buildx build \
                --builder fss-images \
                --platform linux/arm64 \
                --file "Dockerfile.$service" \
                --build-arg "GIT_REVISION=${GITHUB_SHA}" \
                --provenance=false \
                --metadata-file "$RUNNER_TEMP/$service-metadata.json" \
                --tag "$uri:$tag" \
                --push \
                .
              built="$(jq -r '.["containerimage.digest"] // ""' "$RUNNER_TEMP/$service-metadata.json")"
              digest="$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" \
                --query 'imageDetails[0].imageDigest' --output text)"
              if [ "$digest" != "$built" ]; then
                echo "::error::the registry holds $repository:$tag as $digest and the build pushed $built"
                exit 1
              fi
            else
              echo "$existing" >&2
              echo "::error::could not ask the registry whether $repository:$tag exists"
              exit 1
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::'$digest' is not an image digest"; exit 1; }
            echo "$(printf '%s' "$service" | tr '[:lower:]' '[:upper:]')_DIGEST=$digest" >> "$GITHUB_ENV"
            echo "$repository:$tag = $digest"
          done

      - name: Verify the images the registry holds, pulled by digest
        env:
          API_REPOSITORY: ${{ secrets.FSS_REHEARSAL_API_REPOSITORY }}
          WORKER_REPOSITORY: ${{ secrets.FSS_REHEARSAL_WORKER_REPOSITORY }}
        run: |
          set -euo pipefail
          # Not the build: the bytes a rehearsal and production will run.
          docker pull --platform linux/arm64 "$API_REPOSITORY@$API_DIGEST" > /dev/null
          docker pull --platform linux/arm64 "$WORKER_REPOSITORY@$WORKER_DIGEST" > /dev/null
          infra/scripts/release-images.sh verify "$API_REPOSITORY@$API_DIGEST" api "$API_SCHEMA_MIN" "$API_SCHEMA_MAX"
          infra/scripts/release-images.sh verify "$WORKER_REPOSITORY@$WORKER_DIGEST" worker "$WORKER_SCHEMA_MIN" "$WORKER_SCHEMA_MAX"

      - name: Record the digests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fss-image-digests/image-digests.json"
          infra/scripts/release-images.sh record "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$API_DIGEST" "$WORKER_DIGEST" "$out"
          cat "$out"
          {
            echo "### Images published for \`${GITHUB_SHA}\`"
            echo ''
            echo '| image | repository | tag | digest |'
            echo '|---|---|---|---|'
            echo "| api | fss-rh-api | ci-${GITHUB_SHA} | \`${API_DIGEST}\` |"
            echo "| worker | fss-rh-worker | ci-${GITHUB_SHA} | \`${WORKER_DIGEST}\` |"
            echo ''
            echo 'Artifact `fss-image-digests` holds `image-digests.json`: the weekly rehearsal pins to it, and the operator'"'"'s promotion copies these digests to production by digest.'
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/upload-artifact v4, the pin the rehearsal uses.
      - name: Keep the digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fss-image-digests
          path: ${{ runner.temp }}/fss-image-digests/image-digests.json
          if-no-files-found: error
          retention-days: 90
