name: Greenfield infrastructure gate

# Offline only. This workflow never configures a backend, never runs plan or
# apply against one, and never needs an AWS or Google credential. Every
# terraform test run uses mocked providers and a plan-only command.
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/greenfield-infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/greenfield-infra.yml'

permissions:
  contents: read

env:
  # The .tftest.hcl files use mock_provider and run blocks, so the floor is
  # Terraform 1.7; the roots declare >= 1.10 for the S3 native state lock.
  TERRAFORM_VERSION: '1.15.8'

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # hashicorp/setup-terraform v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Release scripts are executable, parse, and pass shellcheck
        # shellcheck is preinstalled on the ubuntu-24.04 image. Errors only: the
        # warnings are style the scripts have not been held to.
        run: |
          set -euo pipefail
          status=0
          for script in infra/scripts/*.sh; do
            [ -x "$script" ] || { echo "::error::$script is not executable"; status=1; }
            bash -n "$script" || { echo "::error::$script does not parse"; status=1; }
          done
          shellcheck --severity=error infra/scripts/*.sh || status=1
          exit "$status"

      - name: Offline gate (fmt, structural checks, validate and test every module and root)
        run: infra/scripts/offline-gate.sh
