name: Greenfield rehearsal registry apply

# The one apply of `infra/roots/rehearsal-registry`, as a workflow.
#
# `fss-rh-deploy` trusts the GitHub OIDC provider and the subject
# `repo:david-cui-bruno/founding-sales:environment:rehearsal`, and nothing else. That
# is Appendix G 39's "distinct roles" clause taken seriously, and it is why an
# operator who runs `terraform apply` in `infra/roots/rehearsal-registry` on a laptop
# is refused `sts:AssumeRole`. The refusal is the design working. So the apply moves
# into the `rehearsal` environment rather than the trust policy moving to admit a
# Mac, and `docs/greenfield/infra-apply-runbook.md` 2.1 now says so.
#
# ## Four rules this file keeps
#
# **Dispatch only.** No `push`, no `pull_request`, no `schedule`. A workflow that can
# obtain this credential from a branch is a workflow a pull request can run.
#
# **The default run changes nothing.** `apply` is a boolean input defaulting to
# `false`, so the first dispatch plans, guards and prints; the operator reads the
# summary and dispatches again with `apply=true`. The plan a person would have read
# in a terminal is read here instead, by a person, in a summary.
#
# **The plan is guarded before it is applied.** `infra/scripts/rehearsal-registry-guard.sh`
# refuses anything that is not the two durable repositories and their lifecycle
# policies, refuses any name outside `fss-rh-`, and refuses any destroy or
# replacement. `force_delete = false` stops a destroy; only the guard stops a
# *replacement*, which is a deletion wearing a create and would take every image past
# releases were rehearsed on.
#
# **The commands are printed on every pull request.** The release workflow's
# credential-free `dry-run` job runs this guard's `commands` mode, and the release
# suite requires every line it prints to appear in this file — so a step added here
# later cannot be one nobody read.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the guarded plan. Leave unticked to plan only and read the summary first.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: '1.15.8'
  AWS_REGION: us-east-1
  # The backend the runbook names (section 0). Public identifiers, all three of them;
  # the state key is deliberately outside the per-run space `fss/greenfield/rehearsal/`,
  # because `registry` is a legal run suffix and a run that collided with this state
  # would destroy the durable repositories on teardown.
  STATE_BUCKET: callie-sourcing-tfstate-326255650484
  STATE_LOCK_TABLE: callie-sourcing-tflock
  STATE_KEY: fss/greenfield/rehearsal-registry/terraform.tfstate

jobs:
  registry:
    name: Plan, guard and (on request) apply the durable rehearsal repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: rehearsal
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      FSS_REHEARSAL_REPORTS: ${{ github.workspace }}/.rehearsal-reports
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The commit the run was dispatched on, named rather than implied: a run
          # whose plan came from one commit and whose guard came from another is a
          # run nobody can read afterwards.
          ref: ${{ github.sha }}
          persist-credentials: false

      # hashicorp/setup-terraform v3, the same pin the release workflow uses.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Say what this run will do, before it can do it
        run: |
          set -euo pipefail
          {
            echo "### Rehearsal registry apply"
            echo ''
            echo "- commit: \`${{ github.sha }}\`"
            echo "- root: \`infra/roots/rehearsal-registry\`"
            echo "- state key: \`${STATE_KEY}\`"
            echo "- apply requested: \`${{ inputs.apply }}\`"
            echo ''
            echo 'The commands this run makes:'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FSS_REHEARSAL_DRY_RUN=1 infra/scripts/rehearsal-registry-guard.sh commands \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # aws-actions/configure-aws-credentials v4, the same pin the release workflow uses.
      - name: Assume the rehearsal deployment role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.FSS_REHEARSAL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: fss-rh-registry

      - name: The assumed identity is the rehearsal role and nothing else
        run: |
          set -euo pipefail
          # The plan below carries `-var=assume_deployment_role=false`: this session
          # already *is* `fss-rh-deploy`, and the provider must not ask STS to assume
          # the role it already holds (that would need the role to trust itself, which
          # Appendix G 39 says it must not). The flag therefore makes the ambient
          # credentials the thing the apply acts as, so they are named and judged
          # here first. An ARN is a public identifier; the script prints it and refuses
          # anything that is not an assumed-role session of the role named.
          infra/scripts/rehearsal-caller-identity.sh fss-rh-deploy

      - name: Initialize the registry backend
        env:
          FSS_REHEARSAL_STATE_KMS_KEY_ARN: ${{ secrets.FSS_REHEARSAL_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          # `backend.hcl` carries the bucket, the key, the region, the lock table and
          # `use_lockfile`; the state KMS key is account-specific and is supplied
          # here. It is an identifier rather than a credential, but it lives with the
          # other account-specific values in the environment and is optional: without
          # it the bucket's default encryption applies, which is what the rehearsal
          # root's own init does today. Whether it was supplied is printed; the value
          # never is.
          if [ -n "${FSS_REHEARSAL_STATE_KMS_KEY_ARN:-}" ]; then
            echo "state encryption: the FSS_REHEARSAL_STATE_KMS_KEY_ARN environment secret was supplied"
            terraform -chdir=infra/roots/rehearsal-registry init -input=false -backend-config=backend.hcl -backend-config="kms_key_id=${FSS_REHEARSAL_STATE_KMS_KEY_ARN}"
          else
            echo "state encryption: no FSS_REHEARSAL_STATE_KMS_KEY_ARN secret, so the bucket's default encryption applies"
            terraform -chdir=infra/roots/rehearsal-registry init -input=false -backend-config=backend.hcl
          fi
          # The three names the runbook pins, asserted against the file rather than
          # trusted: an init that silently picked up another key would put the durable
          # repositories inside a rehearsal run's state space.
          grep -qF "bucket         = \"${STATE_BUCKET}\"" infra/roots/rehearsal-registry/backend.hcl
          grep -qF "key            = \"${STATE_KEY}\"" infra/roots/rehearsal-registry/backend.hcl
          grep -qF "dynamodb_table = \"${STATE_LOCK_TABLE}\"" infra/roots/rehearsal-registry/backend.hcl

      - name: Plan
        run: |
          set -euo pipefail
          # `assume_deployment_role=false`: the root defaults to assuming
          # `fss-rh-deploy`, which is right on a laptop and wrong here, because the
          # step above has already made this session that role. The previous step
          # proved it is. The apply below applies this saved plan, so the flag is on
          # the plan alone and the two cannot disagree.
          terraform -chdir=infra/roots/rehearsal-registry plan -input=false -lock-timeout=5m -var=assume_deployment_role=false -out=rehearsal-registry.tfplan
          terraform -chdir=infra/roots/rehearsal-registry show -json rehearsal-registry.tfplan > rehearsal-registry.plan.json

      - name: The plan guard, which is what reads the plan nobody else can
        id: guard
        run: |
          set -euo pipefail
          {
            echo ''
            echo '### The plan'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Addresses, actions and the two repository names. Never an attribute value.
          infra/scripts/rehearsal-registry-guard.sh plan rehearsal-registry.plan.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          # The saved plan, never a fresh one: the thing applied is the thing the
          # guard read and the operator saw in the previous run's summary.
          terraform -chdir=infra/roots/rehearsal-registry apply -input=false -lock-timeout=5m rehearsal-registry.tfplan

      - name: The two repositories, read back from ECR
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          {
            echo ''
            echo '### The repositories, after the apply'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          aws ecr describe-repositories --repository-names fss-rh-api fss-rh-worker \
            --query 'repositories[].{name:repositoryName,url:repositoryUri,tags:imageTagMutability,scan:imageScanningConfiguration.scanOnPush}' \
            --output table | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo 'Those two URLs are the values of the `rehearsal` environment secrets'
            echo '`FSS_REHEARSAL_API_REPOSITORY` and `FSS_REHEARSAL_WORKER_REPOSITORY`'
            echo '(`docs/greenfield/release.md` 1.3). Set them from here, not by hand.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: This was a plan-only run
        if: ${{ !inputs.apply }}
        run: |
          set -euo pipefail
          {
            echo ''
            echo 'Nothing was applied. Read the plan above; if it creates only'
            echo '`fss-rh-api` and `fss-rh-worker` and destroys nothing, run this'
            echo 'workflow again on the same commit with **apply** ticked.'
          } >> "$GITHUB_STEP_SUMMARY"
