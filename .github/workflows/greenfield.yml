name: Greenfield gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  greenfield:
    # The workspace: apps/*, packages/* and test/release. The secret scan and the root
    # scripts' lint are the "Source security gate" workflow (ci.yml).
    #
    # ubuntu, not macos: this job's only host requirement is a PostgreSQL 16 service
    # container, which GitHub provides on Linux runners. The macOS-specific parts of
    # the product (Electron packaging, Keychain, tel: handoff) are not in this tree.
    runs-on: ubuntu-24.04
    # 20. Until lane g62 this was 45, because the release mutation check was most of
    # the job: about sixteen minutes of it on main at 102 mutations (run 36089059879,
    # "129 suite run(s) in 940 s"), growing by about 15 s with every mutation that
    # names the whole release suite. David's decision of 25 September 2026 moved that check to
    # `.github/workflows/greenfield-nightly.yml`, which runs it once a day on main
    # (and on demand), so this job is typecheck, lint, the workspace tests and the
    # release suite: about three minutes. `test/release/mutationSchedule.check.ts`
    # fails if the mutation check comes back here.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway credential for a container that exists for one job and is
          # reachable only from it. Nothing in the repository depends on this value.
          POSTGRES_PASSWORD: greenfield-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The test harness adopts this cluster instead of starting embedded-postgres.
      FSS_TEST_POSTGRES_URL: postgresql://postgres:greenfield-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Assert the supported Node version
        run: |
          node -e "if (process.versions.node !== '24.20.0') process.exit(1)"
      - name: Assert the service container is PostgreSQL 16
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          version="$(psql "$FSS_TEST_POSTGRES_URL" -tAc 'SHOW server_version')"
          echo "server_version=$version"
          case "$version" in 16.*) ;; *) echo "expected PostgreSQL 16"; exit 1;; esac
      - name: Install
        # --ignore-scripts: the root postinstall fetches the Electron binary, which this
        # job never runs. The greenfield packages have no build step, and
        # embedded-postgres is unused here because the service container is.
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Greenfield gate
        # Typecheck, lint, the workspace tests and the release suite. The release
        # mutation check, which proves the release suite's traps are closed by
        # breaking each one, runs nightly on main instead
        # (`.github/workflows/greenfield-nightly.yml`) and locally as
        # `npm run test:release:mutation`.
        run: npm run gate:greenfield
