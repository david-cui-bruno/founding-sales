name: Greenfield gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  greenfield:
    # Typecheck, lint (the workspace and the root scripts, one ESLint config), the
    # workspace tests and the release suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway credential for a container that exists for one job and is
          # reachable only from it. Nothing in the repository depends on this value.
          POSTGRES_PASSWORD: greenfield-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The test harness adopts this cluster instead of starting embedded-postgres.
      FSS_TEST_POSTGRES_URL: postgresql://postgres:greenfield-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install
        # --ignore-scripts: the root postinstall fetches the Electron binary, which this
        # job never runs. embedded-postgres is unused here because the service container is.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: No durability for the throwaway database
        # The container lives for this job, so waiting on disk flushes buys nothing; a
        # local run starts its embedded cluster with the same three settings
        # (packages/domain/db/testing/embeddedPostgres.ts).
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
      - name: Greenfield gate
        run: npm run gate:greenfield

  upgrade:
    # The automated upgrade test that replaced the schema rehearsal (lane RS, 29
    # September 2026). It applies the DEPLOYED schema from the deployed commit's own
    # migration files, loads a representative fixture through that commit's ordinary
    # commands as `app_runtime`, applies this branch's migrations as the migration role,
    # and checks data preservation, privileges, constraints, both services' startup, the
    # workflows and the recovery paths.
    #
    # **FROM is what production runs, not what git history says** (GPT-6 review of PR
    # 314, P0-2). A base-branch tip is not the deployed schema: if 23 has merged but
    # production is still at 22, a release of 24 would otherwise be given evidence for
    # 23→24 while production performs 22→24. The deployed state is read from
    # production's own public /health (`build.commit`, `schema.databaseVersion`),
    # resolved by tools/ci/resolve-prod-base.sh; the variables `FSS_PROD_SCHEMA` and
    # `FSS_PROD_COMMIT` are only the fallback, and every reading of them fails closed.
    #
    # The job always runs and decides for itself whether there is anything to do. A
    # `paths:` filter would leave a required check waiting for ever on a branch that
    # touches no migration (the same reason `g89-greenfield-is-the-default.md` gives for
    # guarding the old gates by `if:` rather than by `paths:`).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway credential for a container that exists for one job and is
          # reachable only from it. Nothing in the repository depends on this value.
          POSTGRES_PASSWORD: greenfield-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FSS_TEST_POSTGRES_URL: postgresql://postgres:greenfield-ci@127.0.0.1:5432/postgres
      # The public health endpoint, which answers the schema production's database is
      # actually on. No credential; the deploy workflow's smoke reads the same origin.
      FSS_PRODUCTION_ORIGIN: ${{ vars.FSS_PRODUCTION_ORIGIN || 'https://api.usecallie.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The deployed commit has to be in this checkout: the schema production runs
          # is read out of its own copy of `schemaRange.ts`, and its own migration files
          # are what build the deployed schema.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        # Before the guard, not after it: the guard runs the tool's own deployed-range
        # comparison, which is TypeScript. It needs no `npm ci` — that module imports
        # nothing but Node's own and a dependency-free file in this repository — but it
        # does need a Node that can read a `.ts` file.
        with:
          node-version-file: .node-version
      - name: Resolve what production runs, from production
        # The base of the upgrade is what production reports about itself on its public
        # /health (build.commit and schema.databaseVersion), no credential. The repository
        # variables FSS_PROD_COMMIT / FSS_PROD_SCHEMA go stale after every autodeploy
        # (they broke PR 344 and again during releases 0028-0030), so they are only the
        # fallback, with a warning, when /health cannot be reached or parsed; with neither
        # the step fails closed. Bounded curl, three attempts. The logic lives in
        # tools/ci/resolve-prod-base.sh and is run by test/ops/resolveProdBase.check.ts.
        id: prod
        env:
          VAR_PROD_COMMIT: ${{ vars.FSS_PROD_COMMIT }}
          VAR_PROD_SCHEMA: ${{ vars.FSS_PROD_SCHEMA }}
        run: bash tools/ci/resolve-prod-base.sh
      - name: What production runs, and what this branch would move it to
        id: range
        env:
          PROD_SCHEMA: ${{ steps.prod.outputs.schema }}
          PROD_COMMIT: ${{ steps.prod.outputs.commit }}
        run: |
          set -euo pipefail
          range_file=packages/domain/db/schemaRange.ts
          fail() { echo "FAIL: $1" >&2; exit 1; }

          # Fail closed on every unreadable answer. A missing variable is not "nothing
          # to do": it is a job that cannot tell what production runs.
          [ -n "$PROD_SCHEMA" ] || fail 'the repository variable FSS_PROD_SCHEMA is unset; it names the schema production runs'
          [ -n "$PROD_COMMIT" ] || fail 'the repository variable FSS_PROD_COMMIT is unset; it names the commit production'"'"'s images were built from'
          case "$PROD_SCHEMA" in
            ''|*[!0-9]*) fail "FSS_PROD_SCHEMA is '$PROD_SCHEMA', which is not a schema version" ;;
          esac
          [ "$PROD_SCHEMA" -gt 0 ] || fail 'FSS_PROD_SCHEMA is zero'
          case "$PROD_COMMIT" in
            0000000000000000000000000000000000000000) fail 'FSS_PROD_COMMIT is the zero commit' ;;
          esac
          git cat-file -e "$PROD_COMMIT^{commit}" 2>/dev/null || fail "FSS_PROD_COMMIT $PROD_COMMIT is not a commit in this repository"
          git merge-base --is-ancestor "$PROD_COMMIT" HEAD \
            || fail "FSS_PROD_COMMIT $PROD_COMMIT is not an ancestor of this branch; rebase onto what production runs before releasing a schema change"
          git rev-parse --verify --quiet origin/main >/dev/null \
            || git fetch --no-tags --depth=0 origin main:refs/remotes/origin/main >/dev/null 2>&1 || true
          git rev-parse --verify --quiet origin/main >/dev/null || fail 'origin/main is not in this checkout, so FSS_PROD_COMMIT cannot be cross-checked against the released line'
          git merge-base --is-ancestor "$PROD_COMMIT" origin/main \
            || fail "FSS_PROD_COMMIT $PROD_COMMIT is not an ancestor of origin/main; production would be running a commit that was never released"

          required_schema() {
            git show "$1:$range_file" | sed -n 's/^export const REQUIRED_SCHEMA = \([0-9][0-9]*\);$/\1/p'
          }
          from="$(required_schema "$PROD_COMMIT")"
          to="$(required_schema HEAD)"
          [ -n "$from" ] || fail "REQUIRED_SCHEMA could not be read from $PROD_COMMIT"
          [ -n "$to" ] || fail 'REQUIRED_SCHEMA could not be read from HEAD'
          [ "$from" = "$PROD_SCHEMA" ] \
            || fail "the deployed commit declares REQUIRED_SCHEMA $from but FSS_PROD_SCHEMA says $PROD_SCHEMA; one of the two is stale"
          echo "production runs schema $from at $PROD_COMMIT (resolved by the previous step); this branch declares $to"

          # Normally PROD_COMMIT is production's own build.commit, so nothing is behind.
          # On the variable fallback it can lag: any commit deployed at schema `from` has
          # byte-identical migrations 1..from, so a lagging value degrades only the code
          # that writes the fixture, never the migration comparison below. Say so.
          newest_at_from="$PROD_COMMIT"
          for candidate in $(git rev-list --reverse "$PROD_COMMIT..origin/main"); do
            [ "$(required_schema "$candidate")" = "$from" ] || break
            newest_at_from="$candidate"
          done
          if [ "$newest_at_from" != "$PROD_COMMIT" ]; then
            echo "::warning title=FSS_PROD_COMMIT is behind::FSS_PROD_COMMIT is $PROD_COMMIT, but $newest_at_from is the newest commit on main still at schema $from. The migrations compared are identical either way; the fixture is written by older application code than production runs."
          fi

          # A migration at or below the deployed schema that differs from the deployed
          # bytes is refused whatever the schema numbers say: production's runner
          # records a sha256 of each applied file and would refuse the changed one.
          #
          # This runs BEFORE any equal-schema skip, because a branch can leave
          # REQUIRED_SCHEMA alone and still break the deployed history — renaming
          # 0022_a.sql to 0023_b.sql, say. And it is the *tool's own* comparison, run
          # over two real checkouts, rather than a git-level one: `git diff` follows
          # renames, and blob ids are not what the runner checks. A `.gitattributes`
          # change can leave every blob id identical and every checked-out byte
          # different (GPT-6, third review of PR 314, P0-1). `loadMigrations` also
          # applies the runner's filename rule, so a `.sql` name production would
          # refuse fails here instead of being skipped over or truncated at a space.
          git worktree add --detach "$RUNNER_TEMP/upgrade-base" "$PROD_COMMIT"
          node --experimental-transform-types --disable-warning=ExperimentalWarning \
            tools/upgrade/deployedMigrationsMain.ts \
            --base "$RUNNER_TEMP/upgrade-base" --head "$PWD" --through "$from"

          if [ "$from" = "$to" ]; then
            echo "the schema this branch declares is the one production runs, and every deployed migration is byte-identical; there is no upgrade to test"
            echo 'run=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'run=yes'
            echo "from=$from"
            echo "to=$to"
            echo "base_commit=$PROD_COMMIT"
          } >> "$GITHUB_OUTPUT"
      - name: The grants baseline may not move in the same pull request as a migration
        # `grants-baseline.json` is what every privilege comparison is against, so a
        # change that moves both it and a migration can launder any access change past
        # the check (GPT-6 review of PR 314, P0-3). Regenerating the baseline belongs in
        # its own pull request, where the diff is the review — separate commits on one
        # branch are not enough, which is why this compares the whole branch against
        # origin/main. The same rule is expressed in
        # `baselineAndMigrationBothChanged` in `tools/upgrade/grants.ts`, pinned by
        # `test/ops/upgradeAccessExceptions.check.ts`.
        run: |
          set -euo pipefail
          branch_point="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -z "$branch_point" ] || [ "$branch_point" = "$(git rev-parse HEAD)" ]; then
            echo 'nothing of this branch to judge (it is main, or it shares no history with it)'
            exit 0
          fi
          changed="$(git diff --name-only --no-renames "$branch_point" HEAD)"
          baseline_moved=no
          migration_moved=no
          # `if`, not `&&`: under `set -e` a failing `grep` in `grep … && x=yes` ends the step.
          if printf '%s\n' "$changed" | grep -qx 'tools/upgrade/grants-baseline.json'; then baseline_moved=yes; fi
          if printf '%s\n' "$changed" | grep -qE '^packages/domain/db/migrations/[0-9]{4}_.*\.sql$'; then migration_moved=yes; fi
          if [ "$baseline_moved" = yes ] && [ "$migration_moved" = yes ]; then
            echo 'FAIL: this branch moves tools/upgrade/grants-baseline.json and a migration together.' >&2
            echo 'Regenerate the baseline in a pull request of its own, with no migration in it, so the diff is reviewable.' >&2
            exit 1
          fi
          echo "baseline moved: $baseline_moved; migration moved: $migration_moved"
      - name: Install
        if: steps.range.outputs.run == 'yes'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: No durability for the throwaway database
        if: steps.range.outputs.run == 'yes'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
      - name: Upgrade test
        if: steps.range.outputs.run == 'yes'
        env:
          FROM_SCHEMA: ${{ steps.range.outputs.from }}
          TO_SCHEMA: ${{ steps.range.outputs.to }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          npm run upgrade:test -- \
            --from "$FROM_SCHEMA" --to "$TO_SCHEMA" \
            --base "$RUNNER_TEMP/upgrade-base" \
            --evidence "$RUNNER_TEMP/upgrade-evidence-$HEAD_SHA.txt"
      - name: Upload the evidence
        # `always()`: a failed upgrade is the run whose evidence somebody actually needs,
        # and the tool writes a stub report before its first step so that even a run that
        # died in the install leaves one.
        if: always() && steps.range.outputs.run == 'yes'
        # actions/upload-artifact v4, the same pin the images and release workflows use.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upgrade-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          # Outside both checkouts: the tool refuses an evidence path inside one,
          # because a run that can overwrite its own tracked files is not evidence.
          path: ${{ runner.temp }}/upgrade-evidence-*.txt
          if-no-files-found: error

  workflows:
    # actionlint 1.7.12 over every workflow, from the linux_amd64 tarball pinned by the
    # SHA-256 in the v1.7.12 release's checksums file. actionlint's own findings fail the
    # job; the shellcheck it runs on each `run:` block (the runner's own) reports errors
    # only, not its warnings and notes.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install integrity-pinned actionlint 1.7.12
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/callie-actionlint.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          test "$("$tool_dir/actionlint" -version | head -n 1)" = '1.7.12'
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Lint the workflows
        env:
          SHELLCHECK_OPTS: --severity=error
        run: actionlint

  secrets:
    # The Gitleaks scan of the full history and of the tracked tree
    # (scripts/verifySecrets.mjs), on every push and pull request. Gitleaks 8.30.1 from
    # the linux_x64 tarball, pinned by the SHA-256 in the v8.30.1 release's checksums file.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install integrity-pinned Gitleaks 8.30.1
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/callie-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$tool_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          test "$("$tool_dir/gitleaks" version)" = '8.30.1'
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan the history and the tracked tree
        # scripts/verifySecrets.mjs imports only Node's own modules, so nothing is installed.
        run: npm run verify:secrets
