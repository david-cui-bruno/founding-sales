<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The Slice 1 design prototype. Development only: served by `scripts/prototype.ts`
      from 127.0.0.1, never packaged (not in BUNDLE_WINDOWS) and never linked from the
      app's navigation. Static fixtures; no bridge, no API, no network: connect-src 'none'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Callie — design prototype</title>
    <link rel="stylesheet" href="./prototype.css" />
  </head>
  <body>
    <div id="prototype"></div>
    <script type="module" src="./prototype.js"></script>
  </body>
</html>
