<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The renderer loads one local script and nothing else: no remote code, no inline
      script, no eval. `connect-src 'none'` is deliberate — the renderer never talks
      to the network itself, only to the main process across the bridge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Callie</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- A plain container: signed in, Home draws its own sidebar and <main> column in it. -->
    <div id="app"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
