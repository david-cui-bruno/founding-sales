<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The renderer loads one local script and nothing else: no remote code, no inline
      script, no eval. The renderer talks to Callie's API only through the main process,
      across the bridge. The one exception is a call placed from Callie (slice C1): the
      Twilio Voice SDK, bundled locally, runs here because WebRTC runs here, and
      `connect-src` and `media-src` are exactly the entries Twilio documents for it
      (https://twilio.github.io/twilio-voice.js/, "Content Security Policy"). Its
      `script-src` entries are not added: the SDK is in renderer.js, not fetched.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://eventgw.twilio.com wss://voice-js.roaming.twilio.com https://media.twiliocdn.com https://sdk.twilio.com; media-src mediastream: https://media.twiliocdn.com https://sdk.twilio.com; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Callie</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- A plain container: signed in, Home draws its own sidebar and <main> column in it. -->
    <div id="app"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
