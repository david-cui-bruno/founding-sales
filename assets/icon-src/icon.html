<!doctype html>
<html><head><style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .squircle {
    position: relative;
    width: 840px; height: 840px;
    margin: 92px;
    border-radius: 190px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .squircle img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
</style></head>
<body>
  <div class="squircle">
    <img src="cover.png" alt="" />
  </div>
</body></html>
